<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; border-radius:12px; overflow:hidden;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.4)" />
    </linearGradient>

    <linearGradient id="cyanPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filter for subtle drop-shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 120; opacity: 0.3; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0.3; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes particleFloat {
        0% { transform: translate(0, 0) scale(1); opacity: 0.4; }
        50% { transform: translate(20px, -15px) scale(1.2); opacity: 0.8; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
      }
      .animated-beam {
        stroke-dasharray: 20 8;
        animation: pulseBeam 4s linear infinite;
      }
      .node-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .node-card-delay1 {
        animation: floatSlow 5s ease-in-out infinite;
        animation-delay: -1.7s;
      }
      .node-card-delay2 {
        animation: floatSlow 5s ease-in-out infinite;
        animation-delay: -3.4s;
      }
      .particle {
        animation: particleFloat 6s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Subdued Grid Layer -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.2">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Ambient Glow Behind Elements -->
  <circle cx="200" cy="180" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1020" cy="180" r="150" fill="#818cf8" opacity="0.09" filter="url(#glow)"/>
  <circle cx="600" cy="80" r="120" fill="#c084fc" opacity="0.06" filter="url(#glow)"/>

  <!-- Background Animated Network Flows (Behind text) -->
  <g fill="none">
    <!-- Curved Mesh Flow Lines -->
    <path d="M 120 280 C 350 200, 850 200, 1080 280" stroke="#0ea5e9" stroke-width="2" class="animated-beam" opacity="0.45" />
    <path d="M 120 240 C 350 310, 850 310, 1080 240" stroke="#6366f1" stroke-width="2" class="animated-beam" opacity="0.45" style="animation-delay: -2s;" />
    <path d="M 220 290 Q 600 240 980 290" stroke="#a855f7" stroke-width="1.5" class="animated-beam" opacity="0.35" style="animation-delay: -1s;" />
  </g>

  <!-- Floating Dynamic Tech Cards (Bottom flanks, keeping center clear for title) -->
  <!-- Left Side: API Gateway & Mesh Indicators -->
  <g class="node-card" transform="translate(60, 220)">
    <rect width="180" height="74" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="28" cy="28" r="10" fill="#0284c7" opacity="0.4" />
    <circle cx="28" cy="28" r="5" fill="#38bdf8" />
    <text x="48" y="32" fill="#f8fafc" font-size="13" font-weight="700">API GATEWAYS</text>
    <text x="24" y="56" fill="#94a3b8" font-size="11">North-South • L7 Ingress</text>
  </g>

  <!-- Left Side Upper: Envoy & eBPF -->
  <g class="node-card-delay1" transform="translate(160, 90)">
    <rect width="170" height="58" rx="8" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="24" cy="24" r="5" fill="#818cf8" />
    <text x="38" y="28" fill="#e2e8f0" font-size="12" font-weight="600">eBPF &amp; Kernel Mesh</text>
    <text x="24" y="46" fill="#64748b" font-size="10">Sub-millisecond Latency</text>
  </g>

  <!-- Right Side Upper: Service Mesh Card -->
  <g class="node-card-delay2" transform="translate(870, 90)">
    <rect width="180" height="58" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" filter="url(#shadow)"/>
    <circle cx="24" cy="24" r="5" fill="#c084fc" />
    <text x="38" y="28" fill="#e2e8f0" font-size="12" font-weight="600">SERVICE MESH</text>
    <text x="24" y="46" fill="#64748b" font-size="10">East-West • mTLS • Zero-Trust</text>
  </g>

  <!-- Right Side Lower: Integration Runtimes -->
  <g class="node-card-delay1" transform="translate(960, 220)">
    <rect width="180" height="74" rx="10" fill="url(#cardGrad)" stroke="#22d3ee" stroke-width="1.2" filter="url(#shadow)"/>
    <circle cx="28" cy="28" r="10" fill="#0891b2" opacity="0.4" />
    <circle cx="28" cy="28" r="5" fill="#22d3ee" />
    <text x="48" y="32" fill="#f8fafc" font-size="13" font-weight="700">INTEGRATION RUNTIMES</text>
    <text x="24" y="56" fill="#94a3b8" font-size="11">Event-Driven • EIP • Workflows</text>
  </g>

  <!-- Center Floating Nodes & Connecting Particles -->
  <circle cx="340" cy="180" r="4" fill="#38bdf8" class="particle" />
  <circle cx="860" cy="180" r="4" fill="#a855f7" class="particle" style="animation-delay:-3s;" />
  <circle cx="600" cy="305" r="5" fill="#818cf8" class="particle" style="animation-delay:-1.5s;" />

  <!-- Main Center Header in Crisp High-Contrast Foreground -->
  <g text-anchor="middle">
    <!-- Top Category Badge Pill -->
    <g transform="translate(600, 52)">
      <rect x="-160" y="-14" width="320" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <circle cx="-140" cy="0" r="4" fill="#10b981" />
      <text x="6" y="4" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1.5">ENTERPRISE CLOUD ARCHITECTURE</text>
    </g>

    <!-- Main Title (Graduated, sharp drop-shadow) -->
    <text x="600" y="128" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="-0.5" filter="url(#shadow)">
      Awesome Shared Enterprise Microservices
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="165" fill="#cbd5e1" font-size="17" font-weight="500" letter-spacing="0.2">
      Curated Service Meshes, API Gateways &amp; Cloud Integration Runtimes
    </text>

    <!-- Core Badges / Highlights in Foreground -->
    <g transform="translate(600, 205)">
      <!-- Pill 1: Service Mesh -->
      <g transform="translate(-230, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="0" y="5" fill="#38bdf8" font-size="11" font-weight="700">⚡ SERVICE MESH</text>
      </g>
      <!-- Pill 2: API Gateway -->
      <g transform="translate(-75, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
        <text x="0" y="5" fill="#818cf8" font-size="11" font-weight="700">🛡️ API GATEWAY</text>
      </g>
      <!-- Pill 3: Zero Trust -->
      <g transform="translate(75, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
        <text x="0" y="5" fill="#c084fc" font-size="11" font-weight="700">🔒 ZERO TRUST</text>
      </g>
      <!-- Pill 4: Cloud Native -->
      <g transform="translate(230, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#2dd4bf" stroke-width="1"/>
        <text x="0" y="5" fill="#2dd4bf" font-size="11" font-weight="700">☁️ CLOUD NATIVE</text>
      </g>
    </g>

    <!-- Bottom Stat / Feature line -->
    <text x="600" y="278" fill="#64748b" font-size="13" font-weight="500">
      Production-Ready Shared Infrastructure for High-Scale Distributed Microservices
    </text>
  </g>
</svg>
